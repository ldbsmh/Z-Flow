name: Diagnose window backend
on:
  workflow_dispatch:
  push:
    branches: [ 'feat/nativecomplements-window-*' ]
    paths: [ '.github/workflows/diag-window.yml' ]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile only (collect errors)
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:compileReleaseJavaWithJavac :app:compileReleaseKotlin --stacktrace --continue > compile.log 2>&1
          echo "exit=$?"
          grep -n -E "^e: |error:|warning: \[" compile.log | head -200 || true
          tail -60 compile.log
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: compile-log, path: compile.log }
